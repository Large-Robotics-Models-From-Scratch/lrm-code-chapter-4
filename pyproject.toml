[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lrm-ch04"
version = "0.1.0"
description = "Chapter 4 code for 'Build a Large Robot Model (From Scratch)' (Manning): discrete behavior cloning — action tokenizer + parallel baseline head + autoregressive action head on the Chapter 3 VLA backbone"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [
    { name = "Vatsal Chanana" },
    { name = "Siddharth Singh" },
    { name = "Krishnam Gupta" },
]
dependencies = [
    "torch>=2.1,<3.0",
    "transformers>=4.45,<5.0",
    "numpy>=1.24,<3.0",
    "matplotlib>=3.7,<4.0",
]

[project.optional-dependencies]
# Dataset stack: targets the lerobot 0.5.1 API for SO-101 datasets.
data = [
    "lerobot==0.5.1",
    "huggingface-hub>=0.25",
]
# Simulator stack for closed-loop eval. Match the Ch 2 pin so envs reconcile.
sim = [
    "mani-skill==3.0.1",
]
# Chapter 3 backbone, consumed by the action heads.
backbone = [
    "lrm-ch03",
]
# Developer tooling.
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff",
    "jupyter",
    "nbconvert",
    "nbstripout",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 76
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring full pipeline (HuggingFace model downloads, lerobot dataloader, Chapter 3 backbone). Deselect with -m 'not integration'.",
    "slow: tests that take >10s (e.g., real backbone forward pass on CPU).",
]
